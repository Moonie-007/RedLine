<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarthChat</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="mon"><div id="scr"><canvas id="wp" aria-hidden="true"></canvas><div id="desk"><div id="icons"></div></div>
<div id="end"><h1>Signal Complete</h1><p>Three robots. One planet that never stopped answering. Thank you for staying on the line.</p><button class="b" onclick="location.reload()">Dial again</button></div>
<div id="phone" class="hide"><div class="top">EarthChat</div><div class="sub" id="sub">Inbox</div>
<div id="inbox"><div id="rows"></div></div>
<div id="chat" class="hide"><div id="logs"></div><div id="chips"></div>
<div class="in"><input id="tx" placeholder="Ask me anything, e.g. how was I built?" autocomplete="off"><button class="b" id="send">Send</button></div></div>
<div class="keys"><button id="kl">Sound: on</button><button id="kr">Exit</button></div></div>
<div id="tb"><button id="st">Start</button><div id="tasks"></div><span id="clk"></span></div><div id="sm" class="hide"></div><div id="fx"></div></div></div>
<script src="script.js"></script></body></html>
